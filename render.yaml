services:
  - type: web
    name: voice-dataset-maker
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WHISPER_MODEL_SIZE
        value: "tiny"
