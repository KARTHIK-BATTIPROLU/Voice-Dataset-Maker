audio:
  sample_rate: 16000
  duration: 5.0
  channels: 1
  beep_duration: 0.5
  beep_frequency: 800

transcription:
  model_size: "base"  # Options: tiny, base, small, medium, large
  confidence_threshold: 0.4
  device: "cpu"  # Options: cpu, cuda

recording:
  loop_delay: 1.0  # Seconds between beep and recording
  auto_start_next_cycle: true

paths:
  data_dir: "data"
  manifest_file: "manifest.csv"
  state_file: "session_state.json"
  logs_dir: "logs"

quality:
  duplicate_detection_threshold: 5
  enable_quality_warnings: true
  log_low_confidence_samples: true

enrollment:
  target_samples: 20
  holdout_samples: 2          # extra clips recorded after the 20, used only for verification
  single_session_lock: true   # block starting a second session until this one is finalized or reset
  speaker_id: "ASTA_primary"
  min_rms_db: -35             # reject near-silent clips before they ever reach Whisper
  max_clip_peak: 0.98         # reject clipped/distorted clips

